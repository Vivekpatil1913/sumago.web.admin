<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" width="640" height="420" fill="none" role="img" aria-hidden="true">
  <title>Satpur MIDC, Nashik — the primary engineering hub, a wide saw-tooth delivery floor</title>
  <defs>
    <pattern id="sp-grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0v32" stroke="#e6e6e8" stroke-width="1" />
    </pattern>
  </defs>

  <rect width="640" height="420" fill="#ffffff" />
  <rect width="640" height="420" fill="url(#sp-grid)" opacity="0.5" />
  <circle cx="100" cy="80" r="130" fill="#d73438" opacity="0.05" />
  <ellipse cx="320" cy="358" rx="230" ry="12" fill="#1a1a1a" opacity="0.06" />

  <!-- North-light saw-tooth roof — the signature of a working engineering floor -->
  <g>
    <path d="M96 196v-40l68-30v70z" fill="#f5f5f6" stroke="#1a1a1a" stroke-opacity="0.24" stroke-width="1.5" />
    <path d="M164 126 96 156v-8l68-30z" fill="#d73438" opacity="0.45" />
    <path d="M164 196v-40l68-30v70z" fill="#f5f5f6" stroke="#1a1a1a" stroke-opacity="0.24" stroke-width="1.5" />
    <path d="M232 126 164 156v-8l68-30z" fill="#d73438" opacity="0.45" />
    <path d="M232 196v-40l68-30v70z" fill="#f5f5f6" stroke="#1a1a1a" stroke-opacity="0.24" stroke-width="1.5" />
    <path d="M300 126 232 156v-8l68-30z" fill="#d73438" opacity="0.45" />
    <path d="M300 196v-40l68-30v70z" fill="#f5f5f6" stroke="#1a1a1a" stroke-opacity="0.24" stroke-width="1.5" />
    <path d="M368 126 300 156v-8l68-30z" fill="#d73438" opacity="0.45" />
    <path d="M368 196v-40l68-30v70z" fill="#f5f5f6" stroke="#1a1a1a" stroke-opacity="0.24" stroke-width="1.5" />
    <path d="M436 126 368 156v-8l68-30z" fill="#d73438" opacity="0.45" />
  </g>

  <!-- Main delivery floor -->
  <rect x="96" y="196" width="340" height="156" rx="3" fill="#ffffff" stroke="#1a1a1a"
        stroke-opacity="0.3" stroke-width="1.5" />
  <rect x="96" y="196" width="340" height="7" fill="#1a1a1a" opacity="0.12" />

  <!-- Continuous window bands — one long open floor, not cellular offices -->
  <rect x="116" y="220" width="300" height="26" rx="3" fill="#1a1a1a" opacity="0.12" />
  <g stroke="#ffffff" stroke-width="3">
    <path d="M176 220v26M236 220v26M296 220v26M356 220v26" />
  </g>
  <rect x="116" y="264" width="300" height="26" rx="3" fill="#1a1a1a" opacity="0.12" />
  <g stroke="#ffffff" stroke-width="3">
    <path d="M176 264v26M236 264v26M296 264v26M356 264v26" />
  </g>

  <!-- Loading / entrance bay with a brand band -->
  <rect x="116" y="308" width="120" height="14" rx="3" fill="#d73438" opacity="0.7" />
  <rect x="116" y="330" width="70" height="8" rx="4" fill="#1a1a1a" opacity="0.16" />
  <rect x="332" y="312" width="84" height="40" rx="2" fill="#f5f5f6" stroke="#1a1a1a"
        stroke-opacity="0.26" stroke-width="1.5" />
  <path d="M374 312v40" stroke="#1a1a1a" stroke-opacity="0.2" stroke-width="1.5" />

  <!-- Services / server tower -->
  <rect x="452" y="132" width="88" height="220" rx="3" fill="#f5f5f6" stroke="#1a1a1a"
        stroke-opacity="0.28" stroke-width="1.5" />
  <rect x="452" y="132" width="88" height="9" rx="2" fill="#1a1a1a" opacity="0.14" />
  <rect x="478" y="108" width="10" height="26" rx="2" fill="#1a1a1a" opacity="0.2" />
  <circle cx="483" cy="104" r="4" fill="#d73438" />
  <g fill="#1a1a1a" opacity="0.14">
    <rect x="468" y="158" width="56" height="16" rx="2" />
    <rect x="468" y="184" width="56" height="16" rx="2" />
    <rect x="468" y="236" width="56" height="16" rx="2" />
    <rect x="468" y="262" width="56" height="16" rx="2" />
    <rect x="468" y="288" width="56" height="16" rx="2" />
  </g>
  <rect x="468" y="210" width="56" height="16" rx="2" fill="#d73438" opacity="0.45" />

  <!-- Secured compound edge -->
  <path d="M60 352h520" stroke="#e6e6e8" stroke-width="2.5" stroke-linecap="round" />
  <path d="M76 352v-46M76 306h52" stroke="#1a1a1a" stroke-opacity="0.22" stroke-width="2.5"
        stroke-linecap="round" />
  <circle cx="76" cy="298" r="5" fill="#d73438" />
  <path d="M568 352v-46" stroke="#1a1a1a" stroke-opacity="0.22" stroke-width="2.5" stroke-linecap="round" />
  <circle cx="568" cy="298" r="5" fill="#1a1a1a" opacity="0.22" />
</svg>
