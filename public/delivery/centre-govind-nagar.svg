<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" width="640" height="420" fill="none" role="img" aria-hidden="true">
  <title>Govind Nagar, Nashik — corporate and delivery headquarters, 4th and 6th floors marked</title>
  <defs>
    <pattern id="gn-grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0v32" stroke="#e6e6e8" stroke-width="1" />
    </pattern>
  </defs>

  <rect width="640" height="420" fill="#ffffff" />
  <rect width="640" height="420" fill="url(#gn-grid)" opacity="0.5" />
  <circle cx="540" cy="70" r="120" fill="#d73438" opacity="0.05" />
  <ellipse cx="320" cy="358" rx="216" ry="12" fill="#1a1a1a" opacity="0.06" />

  <!-- Lower annex wing -->
  <rect x="108" y="204" width="74" height="148" rx="3" fill="#f5f5f6" stroke="#1a1a1a"
        stroke-opacity="0.22" stroke-width="1.5" />
  <g fill="#1a1a1a" opacity="0.12">
    <rect x="122" y="220" width="46" height="20" rx="2" />
    <rect x="122" y="254" width="46" height="20" rx="2" />
    <rect x="122" y="288" width="46" height="20" rx="2" />
    <rect x="122" y="322" width="46" height="20" rx="2" />
  </g>

  <!-- Main tower -->
  <rect x="172" y="86" width="10" height="12" rx="2" fill="#1a1a1a" opacity="0.2" />
  <rect x="458" y="86" width="10" height="12" rx="2" fill="#1a1a1a" opacity="0.2" />
  <rect x="168" y="80" width="304" height="12" rx="3" fill="#1a1a1a" opacity="0.12" />
  <rect x="382" y="56" width="34" height="26" rx="3" fill="#1a1a1a" opacity="0.1" />
  <rect x="222" y="60" width="18" height="22" rx="2" fill="#1a1a1a" opacity="0.14" />

  <rect x="180" y="92" width="280" height="260" rx="4" fill="#ffffff" stroke="#1a1a1a"
        stroke-opacity="0.3" stroke-width="1.5" />

  <!-- Sumago occupies the 4th and 6th floors (counted from the ground band up) -->
  <rect x="181" y="93" width="278" height="42" fill="#d73438" opacity="0.08" />
  <rect x="181" y="179" width="278" height="43" fill="#d73438" opacity="0.08" />
  <rect x="180" y="92" width="5" height="43" fill="#d73438" />
  <rect x="180" y="179" width="5" height="43" fill="#d73438" />

  <path d="M180 135h280M180 179h280M180 222h280M180 265h280M180 309h280"
        stroke="#1a1a1a" stroke-opacity="0.16" stroke-width="1.5" />

  <!-- Floor 6 and floor 4 glazing, in brand; the rest neutral -->
  <g fill="#d73438" opacity="0.45">
    <rect x="200" y="102" width="42" height="24" rx="2" />
    <rect x="252" y="102" width="42" height="24" rx="2" />
    <rect x="304" y="102" width="42" height="24" rx="2" />
    <rect x="356" y="102" width="42" height="24" rx="2" />
    <rect x="408" y="102" width="34" height="24" rx="2" />
    <rect x="200" y="189" width="42" height="24" rx="2" />
    <rect x="252" y="189" width="42" height="24" rx="2" />
    <rect x="304" y="189" width="42" height="24" rx="2" />
    <rect x="356" y="189" width="42" height="24" rx="2" />
    <rect x="408" y="189" width="34" height="24" rx="2" />
  </g>
  <g fill="#1a1a1a" opacity="0.14">
    <rect x="200" y="146" width="42" height="24" rx="2" />
    <rect x="252" y="146" width="42" height="24" rx="2" />
    <rect x="304" y="146" width="42" height="24" rx="2" />
    <rect x="356" y="146" width="42" height="24" rx="2" />
    <rect x="408" y="146" width="34" height="24" rx="2" />
    <rect x="200" y="232" width="42" height="24" rx="2" />
    <rect x="252" y="232" width="42" height="24" rx="2" />
    <rect x="304" y="232" width="42" height="24" rx="2" />
    <rect x="356" y="232" width="42" height="24" rx="2" />
    <rect x="408" y="232" width="34" height="24" rx="2" />
    <rect x="200" y="276" width="42" height="24" rx="2" />
    <rect x="252" y="276" width="42" height="24" rx="2" />
    <rect x="356" y="276" width="42" height="24" rx="2" />
    <rect x="408" y="276" width="34" height="24" rx="2" />
  </g>

  <!-- Ground floor: signage band and entrance -->
  <rect x="181" y="309" width="278" height="43" fill="#f5f5f6" />
  <path d="M180 309h280" stroke="#1a1a1a" stroke-opacity="0.16" stroke-width="1.5" />
  <rect x="198" y="318" width="86" height="12" rx="3" fill="#d73438" opacity="0.7" />
  <rect x="292" y="320" width="40" height="8" rx="4" fill="#1a1a1a" opacity="0.16" />
  <rect x="384" y="316" width="60" height="36" rx="2" fill="#ffffff" stroke="#1a1a1a"
        stroke-opacity="0.28" stroke-width="1.5" />
  <path d="M414 316v36" stroke="#1a1a1a" stroke-opacity="0.2" stroke-width="1.5" />

  <path d="M60 352h520" stroke="#e6e6e8" stroke-width="2.5" stroke-linecap="round" />
</svg>
