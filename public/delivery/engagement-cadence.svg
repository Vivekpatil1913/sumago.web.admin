<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" fill="none" role="img" aria-hidden="true">
  <title>A live delivery dashboard wired to one named point of contact</title>
  <defs>
    <pattern id="ec-grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0v40" stroke="#e6e6e8" stroke-width="1" />
    </pattern>
    <radialGradient id="ec-amb" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#d73438" stop-opacity="0.09" />
      <stop offset="1" stop-color="#d73438" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="ec-area" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d73438" stop-opacity="0.14" />
      <stop offset="1" stop-color="#d73438" stop-opacity="0" />
    </linearGradient>
    <filter id="ec-shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#1a1a1a" flood-opacity="0.10" />
    </filter>
    <clipPath id="ec-chart">
      <rect x="284" y="196" width="276" height="158" />
    </clipPath>
  </defs>

  <rect width="800" height="600" fill="#ffffff" />
  <rect width="800" height="600" fill="url(#ec-grid)" opacity="0.55" />
  <circle cx="712" cy="72" r="220" fill="url(#ec-amb)" />

  <!-- One named owner, wired into the dashboard -->
  <circle cx="128" cy="300" r="58" fill="#ffffff" stroke="#e6e6e8" stroke-width="1.5" />
  <circle cx="128" cy="300" r="58" fill="none" stroke="#d73438" stroke-width="3"
          stroke-linecap="round" stroke-dasharray="256 108" transform="rotate(-96 128 300)" />
  <circle cx="128" cy="286" r="15" fill="#d73438" />
  <path d="M103 330c0-13.8 11.2-25 25-25s25 11.2 25 25z" fill="#d73438" />
  <circle cx="128" cy="242" r="6" fill="#ffffff" stroke="#d73438" stroke-width="2.5" />
  <circle cx="70" cy="300" r="5" fill="#ffffff" stroke="#1a1a1a" stroke-opacity="0.25" stroke-width="2" />
  <circle cx="128" cy="358" r="5" fill="#ffffff" stroke="#1a1a1a" stroke-opacity="0.25" stroke-width="2" />

  <path d="M190 300h48" stroke="#d73438" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="2 8" />
  <circle cx="244" cy="300" r="4.5" fill="#d73438" />

  <!-- Dashboard panel -->
  <g filter="url(#ec-shadow)">
    <rect x="252" y="120" width="500" height="330" rx="16" fill="#ffffff" />
  </g>
  <rect x="252" y="120" width="500" height="330" rx="16" fill="none" stroke="#e6e6e8" stroke-width="1.5" />
  <path d="M268 120h468a16 16 0 0116 16v34H252v-34a16 16 0 0116-16z" fill="#f5f5f6" />
  <path d="M252 170h500" stroke="#e6e6e8" stroke-width="1.5" />
  <circle cx="276" cy="145" r="4.5" fill="#d73438" />
  <circle cx="294" cy="145" r="4.5" fill="#1a1a1a" opacity="0.16" />
  <circle cx="312" cy="145" r="4.5" fill="#1a1a1a" opacity="0.16" />
  <rect x="336" y="140" width="132" height="10" rx="5" fill="#1a1a1a" opacity="0.16" />
  <rect x="662" y="134" width="68" height="22" rx="11" fill="#d73438" opacity="0.1" />
  <circle cx="676" cy="145" r="3.5" fill="#d73438" />
  <rect x="686" y="141" width="32" height="8" rx="4" fill="#d73438" opacity="0.5" />

  <!-- Planned against actual -->
  <g clip-path="url(#ec-chart)">
    <path d="M284 236h276M284 276h276M284 316h276" stroke="#e6e6e8" stroke-width="1" />
    <path d="M284 206 560 346" stroke="#1a1a1a" stroke-opacity="0.22" stroke-width="2" stroke-dasharray="6 6" />
    <path d="M284 210 330 232 376 228 422 264 468 282 514 318 560 336V354H284z" fill="url(#ec-area)" />
    <path d="M284 210 330 232 376 228 422 264 468 282 514 318 560 336" stroke="#d73438" stroke-width="3"
          stroke-linecap="round" stroke-linejoin="round" />
  </g>
  <path d="M284 196v158h276" stroke="#e6e6e8" stroke-width="1.5" stroke-linecap="round" />
  <g fill="#ffffff" stroke="#d73438" stroke-width="2.5">
    <circle cx="284" cy="210" r="4" />
    <circle cx="376" cy="228" r="4" />
    <circle cx="468" cy="282" r="4" />
    <circle cx="560" cy="336" r="4" />
  </g>

  <!-- Sprint by sprint -->
  <g>
    <rect x="596" y="200" width="128" height="12" rx="6" fill="#f5f5f6" />
    <rect x="596" y="200" width="112" height="12" rx="6" fill="#d73438" />
    <rect x="596" y="232" width="128" height="12" rx="6" fill="#f5f5f6" />
    <rect x="596" y="232" width="94" height="12" rx="6" fill="#d73438" />
    <rect x="596" y="264" width="128" height="12" rx="6" fill="#f5f5f6" />
    <rect x="596" y="264" width="122" height="12" rx="6" fill="#d73438" />
    <rect x="596" y="296" width="128" height="12" rx="6" fill="#f5f5f6" />
    <rect x="596" y="296" width="70" height="12" rx="6" fill="#1a1a1a" opacity="0.28" />
    <rect x="596" y="328" width="128" height="12" rx="6" fill="#f5f5f6" />
    <rect x="596" y="328" width="46" height="12" rx="6" fill="#1a1a1a" opacity="0.18" />
  </g>

  <!-- Status / spend / next up -->
  <g>
    <rect x="284" y="376" width="140" height="58" rx="10" fill="#f5f5f6" />
    <rect x="284" y="376" width="4" height="58" rx="2" fill="#d73438" />
    <rect x="302" y="390" width="46" height="7" rx="3.5" fill="#1a1a1a" opacity="0.22" />
    <rect x="302" y="405" width="76" height="13" rx="6.5" fill="#1a1a1a" opacity="0.72" />
    <rect x="444" y="376" width="140" height="58" rx="10" fill="#f5f5f6" />
    <rect x="462" y="390" width="46" height="7" rx="3.5" fill="#1a1a1a" opacity="0.22" />
    <rect x="462" y="405" width="66" height="13" rx="6.5" fill="#1a1a1a" opacity="0.72" />
    <rect x="604" y="376" width="120" height="58" rx="10" fill="#f5f5f6" />
    <rect x="622" y="390" width="40" height="7" rx="3.5" fill="#1a1a1a" opacity="0.22" />
    <rect x="622" y="405" width="58" height="13" rx="6.5" fill="#1a1a1a" opacity="0.72" />
  </g>

  <!-- Reporting rhythm -->
  <path d="M128 508h576" stroke="#e6e6e8" stroke-width="2.5" stroke-linecap="round" />
  <path d="M128 508h192" stroke="#d73438" stroke-width="2.5" stroke-linecap="round" />
  <circle cx="128" cy="508" r="8" fill="#d73438" />
  <circle cx="320" cy="508" r="8" fill="#d73438" />
  <circle cx="512" cy="508" r="8" fill="#ffffff" stroke="#d73438" stroke-width="2.5" />
  <circle cx="704" cy="508" r="8" fill="#ffffff" stroke="#1a1a1a" stroke-opacity="0.2" stroke-width="2.5" />
  <g fill="#1a1a1a" opacity="0.16">
    <rect x="100" y="530" width="56" height="8" rx="4" />
    <rect x="292" y="530" width="56" height="8" rx="4" />
    <rect x="484" y="530" width="56" height="8" rx="4" />
    <rect x="676" y="530" width="56" height="8" rx="4" />
  </g>
</svg>
