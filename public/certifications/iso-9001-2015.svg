<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 430" role="img" aria-label="ISO 9001:2015 certified">
  <g fill="none" stroke="#0a5aa4" stroke-width="4">
    <!-- Globe outline -->
    <circle cx="230" cy="180" r="150"/>
    <!-- Meridians (longitude) -->
    <line x1="230" y1="30" x2="230" y2="330"/>
    <ellipse cx="230" cy="180" rx="112" ry="150"/>
    <ellipse cx="230" cy="180" rx="60" ry="150"/>
    <!-- Parallels (latitude) -->
    <line x1="80" y1="180" x2="380" y2="180"/>
    <line x1="123" y1="88" x2="337" y2="88"/>
    <line x1="90" y1="125" x2="370" y2="125"/>
    <line x1="90" y1="235" x2="370" y2="235"/>
    <line x1="123" y1="272" x2="337" y2="272"/>
  </g>
  <!-- ISO wordmark with white halo so it reads over the globe grid -->
  <text x="230" y="235" text-anchor="middle" font-family="Arial, Helvetica, sans-serif"
        font-size="168" font-weight="900" fill="#0a5aa4"
        stroke="#ffffff" stroke-width="16" paint-order="stroke"
        style="letter-spacing:-2px">ISO</text>
  <text x="230" y="415" text-anchor="middle" font-family="Arial, Helvetica, sans-serif"
        font-size="66" font-weight="700" fill="#0a5aa4">9001:2015</text>
</svg>
